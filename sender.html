<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sender - TeleCom System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="sender-tx-display-view" class="hidden">
    <button id="btn-exit-tx" class="btn-floating-exit" title="Back to Setup">✕ Back</button>
    <div id="tx-display-container">
      <div id="tx-clock"></div>
      <table id="tx-grid">
        <tr>
          <td id="cell-0"></td>
          <td id="cell-1"></td>
        </tr>
        <tr>
          <td id="cell-2"></td>
          <td id="cell-3"></td>
        </tr>
      </table>
    </div>
  </div>

  <main id="sender-config-view">
    <header>
      <h2>Sender</h2>
    </header>

    <section id="sender-panel">
      <div class="fields">
        <label for="msg-bits">Message bits (up to 20):</label>
        <input type="text" id="msg-bits" placeholder="e.g. 0100011" maxlength="20" autocomplete="off" inputmode="text">

        <label for="error-bit">Simulated Error Bit Index:</label>
        <input type="number" id="error-bit" placeholder="none" min="0" max="19">
      </div>

      <div class="btn_area">
        <button id="btn-show-calib" disabled>Start Transmission</button>
        <button id="btn-reset-sender">Reset</button>
      </div>
    </section>
  </main>

  <!-- Standard Vanilla JS architecture -->
  <script src="js/layout.js"></script>
  <script src="js/hamming.js"></script>
  <script src="js/framing.js"></script>
  <script src="js/audio_tx.js"></script>
  <script src="js/audio_rx.js"></script>
  <script src="js/physical_tx.js"></script>
  <script src="js/sender.js"></script>
</body>

</html>
