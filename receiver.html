<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Receiver</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="receiver_screen">
    <header>
      <h2>Receiver</h2>
    </header>

    <section class="rx-top">
      <div class="fields">
        <label for="color-input">Enter Symbol Colors:</label>
        <input type="text" id="color-input" placeholder="WRGB" maxlength="4" autocomplete="off" class="mono" disabled>
        <br>
        <button id="submit_btn" class="btn" disabled>Submit Symbol</button>
      </div>
    </section>

    <section id="rx-result-area" class="hidden">
      <h3>Decoded Message</h3>
      <div id="rx-message"></div>
      <div id="rx-err-info"></div>
      <div id="rx-meta"></div>
    </section>

    <div class="btn_area">
      <button id="calibrate_btn">Start Calibration & Listening</button>
      <button id="nack_btn_manual" class="nack_btn">Send NACK</button>
      <button id="reset_btn">Reset</button>
      <button id="ack_btn" disabled>Retransmit ACK</button>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/hamming.js"></script>
  <script src="js/framing.js"></script>
  <script src="js/audio_tx.js"></script>
  <script src="js/audio_rx.js"></script>
  <script src="js/receiver.js"></script>
</body>

</html>
