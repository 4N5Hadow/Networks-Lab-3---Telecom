<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Receiver - TeleCom System</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Async loading pattern per OpenCV.js official docs -->
  <script>
    window._cvReady = false;
    function _onOpenCvLoad() {
      if (typeof cv !== 'undefined' && cv.Mat !== undefined) {
        window._cvReady = true;
        document.dispatchEvent(new Event('opencv-ready'));
      } else if (typeof cv !== 'undefined') {
        cv['onRuntimeInitialized'] = function () {
          window._cvReady = true;
          document.dispatchEvent(new Event('opencv-ready'));
        };
      }
    }
  </script>
  <script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="_onOpenCvLoad()"></script>
</head>
<body>
  <main id="screen-receiver">
    <header>
      <h2>Receiver</h2>
      <span id="receiver-status-badge" class="badge">IDLE</span>
    </header>

    <section class="rx-top">
      <div class="cam-wrapper">
        <video id="rx-video" playsinline muted autoplay></video>
        <canvas id="rx-overlay" class="cam-overlay"></canvas>
      </div>
    </section>

    <section id="rx-result-area" class="hidden">
      <h3>Decoded Message</h3>
      <div id="rx-message"></div>
      <div id="rx-err-info"></div>
      <div id="rx-meta"></div>
    </section>

    <div class="btn-row">
      <button id="btn-start-camera">Start Camera</button>
      <button id="btn-calibrate" disabled>Calibrate</button>
      <button id="btn-reset-receiver">Reset</button>
    </div>

    <div id="receiver-log" class="log-box"></div>
  </main>

  <!-- Standard Vanilla JS architecture, similar to WebRTC/OpenCV samples -->
  <script src="js/layout.js"></script>
  <script src="js/hamming.js"></script>
  <script src="js/framing.js"></script>
  <script src="js/audio_tx.js"></script>
  <script src="js/audio_rx.js"></script>
  <script src="js/physical_rx.js"></script>
  <script src="js/receiver.js"></script>
</body>
</html>
