<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Receiver - TeleCom System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen-receiver">
    <header>
      <h2>Receiver</h2>
      <span id="receiver-status-badge" class="badge">IDLE</span>
    </header>

    <section class="rx-top">
      <div class="fields">
        <label for="color-input">Enter Symbol Colors (e.g. RGBW):</label>
        <input type="text" id="color-input" placeholder="W, R, G, B" maxlength="4" autocomplete="off" class="mono" disabled>
        <br>
        <button id="btn-submit-symbol" class="btn" disabled>Submit Symbol</button>
      </div>
    </section>

    <section id="rx-result-area" class="hidden">
      <h3>Decoded Message</h3>
      <div id="rx-message"></div>
      <div id="rx-err-info"></div>
      <div id="rx-meta"></div>
    </section>

    <div class="btn-row">
      <button id="btn-calibrate">Start Calibration & Listening</button>
      <button id="btn-reset-receiver">Reset</button>
      <button id="btn-retransmit-ack" disabled>Retransmit ACK</button>
    </div>

    <div id="receiver-log" class="log-box"></div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/hamming.js"></script>
  <script src="js/framing.js"></script>
  <script src="js/audio_tx.js"></script>
  <script src="js/audio_rx.js"></script>
  <script src="js/receiver.js"></script>
</body>
</html>
